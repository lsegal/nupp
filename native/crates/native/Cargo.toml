[package]
name = "nupp-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nupp_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["base"]
base = []
uri = ["base", "dep:url"]
# A test-only export that panics inside the boundary: nuppNativePanicProbe.
panic-probe = ["base"]

[dependencies]
nupp-native-runtime = { path = "../runtime" }
url = { version = "2.5.7", optional = true }

