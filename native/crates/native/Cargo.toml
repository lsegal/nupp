[package]
name = "nupp-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nupp_native"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["base"]
base = []
# The pinned stage-zero compiler still asks for `gpu` when it stages the
# compiler's own native facilities. The GPU provider is Nupp over wgpu-native
# now, so the feature selects nothing; it goes once the pin moves past this.
gpu = ["base"]
uri = ["base", "dep:url"]
http = ["base", "dep:nupp-native-http"]
net = ["base", "dep:nupp-native-net"]
tls = ["net", "dep:nupp-native-tls"]
# A test-only export that panics inside the boundary: nuppNativePanicProbe.
panic-probe = ["base"]
# The AOT code generator: LLVM and lld, linked in (NUPP_LLVM_PREFIX).
codegen = ["base", "dep:nupp-native-codegen", "nupp-native-codegen/llvm"]

[dependencies]
nupp-native-abi = { path = "../abi" }
nupp-native-http = { path = "../http", optional = true }
nupp-native-net = { path = "../net", optional = true }
nupp-native-tls = { path = "../tls", optional = true }
nupp-native-runtime = { path = "../runtime" }
nupp-native-codegen = { path = "../codegen", optional = true }
url = { version = "2.5.7", optional = true }

[build-dependencies]
cc = "1"
