[package]
name = "nupp-native-host"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "nupp"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
lpeg = []
native-files = []
native-net = []
native-process = []
native-tls = []
native-checksum = []
native-compression = []
# The embedding ABI starts no workers and refuses a host that declares them;
# the feature remains so one feature list selects both the host executable and
# the embedding SDK.
workers = []
