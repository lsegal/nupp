# cargo-about's policy for wgpu-native's lock file: wgpu's own graph, the one Rust
# graph anything here distributes. It accepts what that release ships.
accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false

[private]
ignore = true
