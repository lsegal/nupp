name: scratch issue 7 accumulator case

on:
  push:
    branches: [scratch/issue-7-case]

permissions:
  contents: read
  actions: read

jobs:
  case:
    name: ${{ matrix.os }} ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        label: [branch, main]
        include:
          - label: branch
            ref: c25fbe38635f8c604bdb7e48648de72464aa21e4
          - label: main
            ref: 8769374626a71317b0f67c773ed4afd7efc04873
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NUPP_REQUIRE_CODEGEN: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: Fetch the pinned LLVM
        uses: ./.github/actions/pinned-llvm
      - name: Build the compiler
        run: ./bin/nupp --version
      - name: The case alone
        run: |
          set -uo pipefail
          mkdir -p /tmp/case && cd /tmp/case
          printf '%s\n' '@aot' 'local function unsafe(text: string): string' '    local answer = ""' \
            '    answer = answer .. text' '    local retained = {1}' '    retained[1] = 2' '    return answer' 'end' '' \
            'return {unsafe = unsafe}' > unsafe.nupp
          start=$(date +%s)
          if [ "$(uname -s)" = Darwin ]; then t="/usr/bin/time -l"; else t="/usr/bin/time -v"; fi
          timeout 150 $t "$GITHUB_WORKSPACE/bin/nupp" aot unsafe.nupp > out.txt 2> time.txt
          echo "exit $? after $(( $(date +%s) - start ))s"
          tail -8 out.txt
          grep -iE "maximum resident" time.txt || tail -5 time.txt
