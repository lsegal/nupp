name: Compiler matrix

on:
  # Every branch, and the trunk above all.
  #
  # This was briefly `branches-ignore: main`, which was right only while a
  # ruleset stood in front of the trunk: a check run belongs to a commit rather
  # than to a branch, so the branch run was the one the trunk push presented,
  # and running the same matrix again over the same commit object bought
  # nothing. There is no ruleset now. Nothing else asks a question about a
  # commit pushed straight to `main`, so if this does not, nothing does.
  #
  # Worktree branches are here too, so a task can find out before it lands
  # rather than after.
  push:
    branches:
      - "**"
    # A pre-release tag (`v0.0.15-vm.1`) names a commit its branch push already
    # tested; running the matrix again over the same commit buys nothing.
    tags:
      - "*"
      - "!v*-*"
  # Retained for a contribution from a fork, where no push to this repository
  # happens and this is the only event there is. A pull request from a branch of
  # this repository would be tested twice, which is a case this repository's
  # workflow does not produce.
  pull_request:
  workflow_dispatch:
  # The affected-surface classifier is deliberately conservative, but it is a
  # judgement all the same. Run the whole matrix nightly whatever changed, so a
  # gap in the classification is found by this backstop rather than by a user.
  # A failure here is a bug and blocks the next release; it is not a warning.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  # The browser guest it calls fetches the pinned LLVM artifact.
  actions: read

# Grouped per ref, so a newer push to the same ref cancels the older run.
#
# This was briefly grouped per commit, to keep a result against every commit in
# the trunk's history rather than only against the tip. It cost more than it
# bought: a per-commit group is a group of one, so nothing ever supersedes
# anything, and the macOS leg takes an hour and a half against commits that land
# every few minutes. The queue grows without bound, and the answer a run finally
# gives is about a commit twenty commits behind the tip -- which leaves the tip,
# the one commit anybody is going to act on, the last thing to be tested.
#
# What is given up is the ability to say "this commit was green and the next one
# was red" directly. A cancelled run means a later run covers both commits, so a
# failure there is bisected rather than read off. That is the cheaper half of the
# trade, because the trunk is fixed forward: what matters is that the tip is
# tested promptly, and under the per-commit shape it never was.
#
# A worktree branch loses nothing by this. The old shape kept its run alive on
# the grounds that it is the only thing standing between that commit and the
# trunk, but a second push to the same branch has already replaced the commit
# that run was answering about; the branch's tip is the only answer its task
# wants, and that is the run that survives.
#
# The event name is in the key so a push cannot cancel the nightly backstop
# declared above: a scheduled run's `github.ref` is `refs/heads/main` too.
# The five-minute suite budget (#351) is a hard halt, not a target: a test step
# still running at five minutes has failed it, and an hour more of it tells
# nobody anything (#375). Each test step ends its run here through
# suite-deadline.sh, which names what was still running before it stops.
env:
  NUPP_SUITE_SECONDS: 300

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a run can decide before it provisions anything. This is the job
  # that must stay cheap: the platform matrices wait on it, so a minute here is
  # a minute added to every path through the graph.
  classify:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs-site: ${{ steps.classify.outputs.docs-site }}
      fast-checks: ${{ steps.classify.outputs.fast-checks }}
      linux-integration: ${{ steps.classify.outputs.linux-integration }}
      macos-integration: ${{ steps.classify.outputs.macos-integration }}
      windows-integration: ${{ steps.classify.outputs.windows-integration }}
      portable-compiler: ${{ steps.classify.outputs.portable-compiler }}
      browser-wasm: ${{ steps.classify.outputs.browser-wasm }}
      gpu-linux: ${{ steps.classify.outputs.gpu-linux }}
      gpu-windows: ${{ steps.classify.outputs.gpu-windows }}
      fixpoint: ${{ steps.classify.outputs.fixpoint }}
      integration-matrix: ${{ steps.matrix.outputs.integration }}
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The classifier is plain Lua so that the suite can assert on it. This is
      # the only thing this job provisions, and on a cache hit it is a second.
      - name: Provide a Lua interpreter
        run: echo "$(./scripts/toolchain luajit)/bin" >> "$GITHUB_PATH"

      - name: Name the changed paths
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          usable() {
            [ -n "$1" ] \
              && [ "$1" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          # A branch is compared against the trunk it will become, never against
          # its own previous tip.
          #
          # `before` is the tempting answer and it is wrong. What this run
          # authorises is pushing `HEAD_SHA` to `main`, so the question is what
          # this commit changes about the trunk -- not what its last commit
          # changed about the one before it. Narrowing against `before` opens a
          # real hole: a commit that fails the GPU job, then a commit touching
          # only documentation, and the second run skips GPU, goes green, and
          # carries the first one's failure onto the trunk. Comparing against the
          # merge base costs the same and cannot do that.
          #
          # It is also the honest answer for the case that happens most here: a
          # task worktree pushed once when its work is done, whose `before` is
          # all zeros because the branch is new.
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            # The trunk has no merge base to compare against but its own
            # history, so the previous tip is the answer here, and it is the
            # right one: what is new on `main` is what arrived since `main` was
            # last at that commit.
            base=$PUSH_BEFORE
          elif [ "$EVENT" = push ]; then
            git fetch --no-tags --depth=200 origin main 2>/dev/null || true
            base=$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)
            # A branch with no common history with `main` -- or a fetch that did
            # not reach far enough back -- has no merge base, and `before` is
            # then better than nothing.
            if ! usable "$base"; then
              base=$PUSH_BEFORE
            fi
          fi

          # A tag, a schedule and a manual dispatch have no diff to narrow, and
          # neither does a branch whose merge base could not be found. An empty
          # list means "everything", which the classifier decides rather than
          # this shell.
          if usable "$base"; then
            git diff --name-only "$base" "$HEAD_SHA" > changed-paths.txt
          else
            : > changed-paths.txt
          fi
          echo "--- changed paths ---"
          cat changed-paths.txt

      - name: Classify the affected surfaces
        id: classify
        run: luajit .github/scripts/classify-changes.lua < changed-paths.txt

      # The classifier and the workflow have to agree about which jobs exist.
      # They are two files, so the only thing that keeps them agreeing is this
      # check, which runs before anything expensive is provisioned.
      - name: Validate selected-job aggregation
        run: python3 .github/scripts/test-required-ci.py

      - name: Validate the workflow against the classifier
        run: luajit .github/scripts/validate-ci-coverage.lua

      # Composing the platform matrix here rather than putting three `if`s on
      # three near-identical jobs keeps one copy of a two-hundred-line job and
      # makes the selection itself reviewable as data.
      - name: Compose the integration matrix
        id: matrix
        env:
          SELECTED_LINUX: ${{ steps.classify.outputs.linux-integration }}
          SELECTED_MACOS: ${{ steps.classify.outputs.macos-integration }}
          SELECTED_WINDOWS: ${{ steps.classify.outputs.windows-integration }}
        run: luajit .github/scripts/compose-integration-matrix.lua

      # Only on a cold cache, where this job has just built LuaJIT from source
      # and every job behind it is about to do the same. `fast-checks` saves the
      # same key, so whichever arrives second warns and keeps the first entry.
      - name: Save the provisioned toolchain
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}

  # Formatting, the checker, and every suite a Nupp worker can share a process
  # with. Run these before the platform jobs so failures appear before platform
  # provisioning.
  fast-checks:
    name: Fast checks
    needs: classify
    if: needs.classify.outputs.fast-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      # The pre-push hook asks the same question of the files a push changes.
      # Ask it of the whole tree here, because a rewrite landed by a `--no-verify`
      # push is otherwise found by whichever unrelated change comes next.
      - name: Check the formatting
        run: |
          ./bin/nupp fmt --write
          if ! git diff --quiet; then
            echo "nupp fmt --write rewrote committed source:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - name: Check the compiler
        run: ./bin/nupp check

      # Saved explicitly rather than through the action's post step, so a run
      # that fails a suite still keeps the compiler build the next run would
      # otherwise redo. The entries validate their own content, so a stale one
      # is a miss and cannot change an answer.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  # The compiler each rolling leg runs, built once per platform beside the fast
  # gate rather than inside every leg after it, so a leg starts on its suites
  # instead of on a five-minute bootstrap. Its setup matches the leg's, LLVM and
  # all, because the leg's warm `nupp build` must find nothing left to do.
  bootstrap:
    name: ${{ matrix.name }} / bootstrap
    needs: classify
    if: needs.classify.outputs.integration-matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.integration-matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: |
          ./scripts/toolchain --all
          echo "$(./scripts/toolchain luajit)/bin" >> "$GITHUB_PATH"

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      # A tarball rather than the directory, so the launcher and the staged
      # libraries keep their modes. The store and the test runner's records are
      # left out: each leg restores its own.
      - name: Pack the compiler
        shell: bash
        run: tar -cf compiler.tar --exclude=build/cache --exclude=build/test-runner build

      - name: Upload the compiler
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.artifact }}
          path: compiler.tar
          retention-days: 1

      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  integration:
    name: ${{ matrix.name }} / LuaJIT 2.1 rolling
    # Not `needs: bootstrap`: that waits for every platform's entry, so a leg
    # would sit behind another platform's queued runner. Each leg waits for its
    # own platform's bootstrap below instead.
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.integration-matrix != '[]'
    runs-on: ${{ matrix.os }}
    # A timeout is here to end a hang, so it has to sit above the work rather
    # than across it. A cold runner builds the native provider before the
    # broad suite and must have time for both. A killed job also skips its post
    # steps, so it never saves the cache and would miss again next time.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.classify.outputs.integration-matrix) }}
    steps:
      # The compiler suite's own deadline is counted from here, so it always
      # lands before `timeout-minutes` however long the steps ahead of it took.
      - name: Note when the job started
        shell: bash
        run: echo "NUPP_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the repository
        uses: actions/checkout@v5

      # This is a parser/checker oracle, not a build dependency. Pinning the
      # source keeps a language change from being conflated with an upstream
      # corpus change, and sparse checkout avoids fetching the rest of Teal.
      - name: Check out the Teal 0.8.0 tl.lua oracle
        uses: actions/checkout@v5
        with:
          repository: teal-language/tl
          ref: 8ea89e75751e6cea0547f3838e0e244497d88bd6
          path: .ci-corpus/teal
          sparse-checkout: tl.lua
          sparse-checkout-cone-mode: false

      # After the checkout rather than before it: `actions/checkout` cleans the
      # workspace, and `.rocks` is ignored, so anything restored first would be
      # removed again before a step could use it.
      #
      # The key carries what pins both halves: the toolchain pins for the tools,
      # and the rockspecs in rocks/ for `.rocks`, which is every rock nupp.lua
      # installs (toolchaintest holds it to that). A build takes an installed
      # rock at its version as it is, so a tree restored from other rockspecs
      # would be used unchecked. nupp.lua itself is left out: it changes several
      # times a week for reasons that install nothing. Editing either rebuilds
      # every platform's tools, which is a few minutes on a change nobody makes
      # weekly.
      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      # Each entry validates its own content, so an approximate match is useful
      # here where it would not be above: a lock file that moved on rebuilds the
      # crates that changed and reuses the rest.
      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      # Passing results keyed by each suite's content fingerprint: its files and
      # everything they load, the built compiler, the platform and the flags. A
      # fingerprint that cannot be fully accounted for is a miss and executes,
      # so an approximate restore can only save time, never reuse a stale pass.
      # Never-cache suites (timing, process lifecycle, measurement) execute
      # regardless; see `neverCache` in tests/groups.lua.
      - name: Restore the recorded test results
        uses: actions/cache/restore@v4
        with:
          path: build/test-runner/.nupp-test-results
          key: >-
            nupp-test-results-integration-${{ runner.os }}-${{ runner.arch }}-${{
            github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nupp-test-results-integration-${{ runner.os }}-${{ runner.arch }}-

      # Suite durations are what the worker queue is packed from. A clean
      # runner without them packs blind and the busiest shard decides the wall
      # clock, so this is a scheduling input, not a correctness one: an
      # approximate match is exactly as useful as an exact one.
      - name: Restore the recorded suite timings
        uses: actions/cache/restore@v4
        with:
          path: build/test-runner/.nupp-test-times.json
          key: >-
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-${{
            github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-

      # The AOT code generator is LLVM, linked into nupp. Fetched once per pin
      # and platform, so a run never builds it unless the pin moved.
      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./scripts/toolchain --all

      # LuaJIT 3.0 has not been released. Its matrix entries belong beside
      # these when it has a source revision to pin; accepting an unversioned
      # development branch here would make two runs of one commit test
      # different interpreters. The rolling 2.1 pin must retain the syntax
      # backports generated Nupp uses.
      - name: Verify the LuaJIT matrix member
        shell: bash
        run: |
          set -euo pipefail
          . ./scripts/luajit.sh
          export NUPP_LUAJIT_FLOOR="$LUAJIT_FLOOR"
          luajit=$(./scripts/toolchain luajit)
          "$luajit/bin/luajit" -e '
            local floor = assert(tonumber(os.getenv("NUPP_LUAJIT_FLOOR")))
            local rolling = jit.version:match("^LuaJIT 2%.1%.(%d+)")
            assert(rolling, "expected LuaJIT 2.1 rolling, got " .. jit.version)
            assert(tonumber(rolling) >= floor,
              ("LuaJIT 2.1.%s is below the 2.1.%d floor"):format(rolling, floor))
            print(jit.version)
          '
          echo "$luajit/bin" >> "$GITHUB_PATH"

      # Waits while this platform's bootstrap job runs. One that has not left
      # the queue is not waited for: it may be queued behind this very runner,
      # and the build below then does the work here, as it did before.
      - name: Wait for this platform's bootstrap
        id: shared-compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_JOB: ${{ matrix.name }} / bootstrap
        run: |
          jobs=repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          while :; do
            state=$(gh api "$jobs" --paginate \
              --jq ".jobs[] | select(.name == env.BOOTSTRAP_JOB) | \"\\(.status) \\(.conclusion)\"" | head -n 1)
            echo "$BOOTSTRAP_JOB: ${state:-not found}"
            case "$state" in
              "completed success") echo "available=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              in_progress*) sleep 15 ;;
              *) echo "building the compiler here instead"; exit 0 ;;
            esac
          done

      - name: Download the bootstrapped compiler
        if: steps.shared-compiler.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: compiler-${{ matrix.artifact }}

      # The launcher decides freshness by mtime, and the checkout above is newer
      # than anything the bootstrap job wrote. Touching the unpacked tree says
      # what is true: it was built from these sources. The build below still
      # compares content hashes, so a mismatch rebuilds rather than passing.
      - name: Unpack the bootstrapped compiler
        if: steps.shared-compiler.outputs.available == 'true'
        shell: bash
        run: |
          tar -xf compiler.tar
          rm compiler.tar
          find build -path build/cache -prune -o -path build/test-runner -prune -o -exec touch {} +

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      - name: Install the portable Lua matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua5.2 lua5.3 lua5.4

      - name: Run compat-checked output across Lua runtimes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          luajit=$(./scripts/toolchain luajit)
          scripts/portable-lua-corpus.sh \
            lua5.1 lua5.2 lua5.3 lua5.4 "$luajit/bin/luajit"

      - name: Run the Lua 5.1 compatibility corpus
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/lua51-compat-corpus.sh lua5.1

      - name: Compare ordinary and compat-checked generation
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/dual-dialect-library.sh lua5.1

      - name: Diagnose a Windows native-library load failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem build/lib
          dumpbin /dependents build/lib/nupp_native_dev.dll

      - name: Install the development rocks
        shell: bash
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      # Already answered on Linux by the fast gate, which every path through
      # this graph passes through before reaching here. The other platforms are
      # asked because a checker answer is not promised to be platform-free.
      - name: Check the compiler
        if: runner.os != 'Linux'
        shell: bash
        run: ./bin/nupp check

      # The Windows host ABI is MinGW's, shared by the application host and
      # embedding SDK. Exercise that
      # contract before the expensive native and full-suite gates so a test
      # fixture cannot accidentally model Windows as an invented Unix host.
      #
      # Fail close to provisioning, and name the last case if the Windows
      # loader or native networking layer terminates the test process. Exercise
      # the nested launcher fixtures here too: in the full suite that process is
      # one long-lived shard, so a failure otherwise appears twenty minutes later
      # as many unrelated unrun suites. The broad suite below leaves this group
      # out rather than running it a second time unchanged.
      - name: Run the Windows native and launcher preflight
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_TRACE_CASES: 1
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path")
          NUPP_TEST_SH=$(cygpath -w "$sh_path")
          export NUPP_TEST_BASH NUPP_TEST_SH
          .github/scripts/suite-deadline.sh "$(($(date +%s) + NUPP_SUITE_SECONDS))" -- \
            ./bin/nupp test --fresh --scope=all --group=windows-preflight

      # Keep the external corpus and the C importer explicit. A configured
      # corpus used to be absent and silently skipped, while an import-c failure
      # could be buried among thousands of unrelated cases. The broad suite
      # below excludes this group rather than repeating it.
      - name: Run the tl.lua oracle and import-c fixtures
        shell: bash
        run: |
          compiler_root=$PWD
          if command -v cygpath >/dev/null 2>&1; then
            compiler_root=$(cygpath -m "$compiler_root")
          fi
          export NUPP_COMPILER_ROOT="$compiler_root"
          export NUPP_LUA_CORPUS="$compiler_root/.ci-corpus/teal/tl.lua"
          export NUPP_NATIVE_LIBRARY
          NUPP_NATIVE_LIBRARY=$(./scripts/toolchain native-provider base)
          # `tests/run` refuses to start on Windows without these, the same way
          # the whole-suite step below names them. This step reaches the runner
          # directly rather than through `nupp test`, so it has to name them
          # too, or the Windows job ends here having run no test at all.
          if [ "$RUNNER_OS" = Windows ]; then
            bash_path=$(command -v bash)
            sh_path=$(dirname "$bash_path")/sh.exe
            test -f "$sh_path"
            export NUPP_TEST_BASH NUPP_TEST_SH
            NUPP_TEST_BASH=$(cygpath -w "$bash_path")
            NUPP_TEST_SH=$(cygpath -w "$sh_path")
          fi
          ./bin/nupp build --target testRunner
          # Halted NUPP_SUITE_SECONDS after the runner build, like every other
          # test step (#375), with its workers named the way the suite step's
          # deadline names them. It takes about a minute and a half on Linux.
          deadline=$(($(date +%s) + NUPP_SUITE_SECONDS))
          .github/scripts/suite-deadline.sh "$deadline" -- \
            ./tests/run --fresh --scope=all --group=external-corpus

      # Three minutes of starting child processes, and the only thing that can
      # change what they answer is bench code. `measurement` is the surface every
      # such path reaches -- the runner, its CLI, `src/nupp/bench/`, `bench/` and
      # this suite itself -- so the classifier turning it off means nothing that
      # could have moved the result went unrun.
      #
      # The rest of the bench surface is not gated. The `keep` intrinsic's
      # lowering, the allocation account, the statistics and the fork merge rules
      # live in `benchtest`, which the broad suite runs on every change, because a
      # compiler change can break those without touching anything named above.
      - name: Run the benchmark runner suite
        if: >-
          runner.os == 'Linux'
          && contains(needs.classify.outputs.selection, '"measurement"')
        shell: bash
        run: >-
          .github/scripts/suite-deadline.sh "$(($(date +%s) + NUPP_SUITE_SECONDS))" --
          ./bin/nupp test --fresh --scope=all --group=measurement

      # No step names `--jobs`: the runner's default, one Nupp worker per core,
      # is the binding setting on every platform (#351).
      #
      # Every suite runs in one `nupp test`, one process, so the compiler, the
      # test runner and the native provider are checked and built once for all
      # of them, and each command a test starts uses that build rather than
      # checking it again (bin/nupp, "One test run is one build of this tree").
      #
      # `--exclude-group` names what earlier steps in this job already ran, and
      # `wasm-conformance`, which the SIMD conformance workflow runs sharded.
      # hostbinarytest stamps this binary once and reuses it while it is newer
      # than its sources. Stamped here, its host build -- a link with LLVM in
      # it -- does not hold the checkout's build lock while every other test's
      # nupp waits on it. On every platform: on Linux the runner otherwise stamped
      # it before the first suite started, about 150 s of the suite step (#396).
      - name: Stamp the compiler binary
        shell: bash
        run: ./bin/nupp build --target dist

      - name: Run the compiler suite
        if: runner.os != 'Windows'
        shell: bash
        # `core_pattern` already pipes to systemd-coredump on this image, but
        # the soft limit is zero, so the kernel writes nothing and the shell
        # still says "core dumped". Raising it here is what makes the step
        # below able to ask a crashed worker anything at all.
        #
        # The run is halted NUPP_SUITE_SECONDS after this step starts (#375).
        # Ending it here rather than by the job timeout samples what it left
        # running and ends its workers, so the runner names each one and the
        # suite it was in, and the steps that report a stalled run still run.
        run: |
          set -euo pipefail
          ulimit -c unlimited || true
          deadline=$(($(date +%s) + NUPP_SUITE_SECONDS))
          # The runner stops itself 30 seconds before the halt, says which
          # suites finished, how long each took and which were still running,
          # and records their timings (#351).
          NUPP_TEST_DEADLINE=$((deadline - 30))
          export NUPP_TEST_DEADLINE
          .github/scripts/suite-deadline.sh "$deadline" -- \
            ./bin/nupp test --scope=all \
            --exclude-group=external-corpus,measurement,wasm-conformance

      # A worker killed by a signal says which suite it was in, and on Linux it
      # is killed by SIGSEGV in a different set of suites every run -- so the
      # name says where it was, not what went wrong. The core says that.
      # Retrieved through `coredumpctl` because `core_pattern` hands cores to
      # systemd rather than leaving them in a directory. Only runs when the
      # step above failed, and never fails the job itself: this reports on a
      # failure, it is not one.
      # A run that stops making progress used to be ended by the job timeout
      # with nothing said about where it stood: every macOS leg from a7deafd88
      # on sat at "shell suites joining" for an hour with one Nupp worker that
      # had finished its suites and never exited. The suite step's deadline now
      # reports that itself; this lists whatever a failed run left running and
      # samples each test process, which names the call it is blocked in. A
      # force-cancelled job skips it, as it skips every remaining step.
      - name: Report a stalled run
        if: (failure() || cancelled()) && runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: .github/scripts/report-stalled-run.sh

      - name: Report a crashed worker
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "core_pattern: $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
          coredumpctl list --no-pager 2>&1 | tail -12 || true
          command -v gdb >/dev/null 2>&1 \
            || sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
          for pid in $(coredumpctl list --no-pager --no-legend 2>/dev/null \
              | awk '$NF ~ /present/ || $0 ~ /luajit|nupp/ {print $5}' | tail -3); do
            echo "=== core for pid $pid ==="
            coredumpctl info "$pid" --no-pager 2>&1 | head -30
            coredumpctl debug "$pid" --debugger=gdb \
              --debugger-arguments='-batch -q -ex "thread apply all bt 25"' \
              2>&1 | head -60
          done
          exit 0

      # Where the suite saves what a dying worker was holding: the library each
      # native case built and its phase trace. Both are written by the suite
      # itself, which is why they arrive at all -- four rounds of Windows
      # crashes were diagnosed out of these and none out of a minidump. Windows
      # Error Reporting was asked for one here through its LocalDumps keys and
      # never produced a file or an Application Error event, so the request is
      # gone rather than left looking like coverage.
      - name: Make room for Windows worker diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'nupp-worker-dumps') | Out-Null

      # Halted NUPP_SUITE_SECONDS after it starts, as on the other platforms
      # (#375), so an over-budget run is ended with its process tree listed and
      # its workers named while the job can still say so.
      - name: Run the compiler suite
        if: runner.os == 'Windows'
        shell: bash
        env:
          NUPP_TEST_AOT_TRACE: 1
          NUPP_TEST_AOT_ARTIFACTS: ${{ runner.temp }}/nupp-worker-dumps
        run: |
          set -euo pipefail
          bash_path=$(command -v bash)
          sh_path=$(dirname "$bash_path")/sh.exe
          test -f "$sh_path"
          NUPP_TEST_BASH=$(cygpath -w "$bash_path")
          NUPP_TEST_SH=$(cygpath -w "$sh_path")
          export NUPP_TEST_BASH NUPP_TEST_SH
          deadline=$(($(date +%s) + NUPP_SUITE_SECONDS))
          # The runner stops itself 30 seconds before the halt, says which
          # suites finished, how long each took and which were still running,
          # and records their timings (#351).
          NUPP_TEST_DEADLINE=$((deadline - 30))
          export NUPP_TEST_DEADLINE
          .github/scripts/suite-deadline.sh "$deadline" -- \
            ./bin/nupp test --scope=all \
            --exclude-group=external-corpus,windows-preflight,measurement,wasm-conformance

      # What the suite saved, named in the log so a reader knows what the
      # artifact holds before downloading it. `aot-libraries.txt` beside these
      # says which case built each library and which tier its detector chose,
      # which is the question a saved library on its own cannot answer: the
      # runner pool is mixed, and a case that passed may simply never have run
      # the code being examined.
      - name: Report Windows worker crashes
        if: failure() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:RUNNER_TEMP 'nupp-worker-dumps'
          New-Item -ItemType Directory -Force $dumpDirectory | Out-Null
          Get-ChildItem $dumpDirectory | Format-Table Name, Length

      - name: Upload Windows worker crash diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-worker-crashes
          path: ${{ runner.temp }}/nupp-worker-dumps
          if-no-files-found: ignore
          retention-days: 7

      # Only from a run that completed: a cancelled or timed-out run skips this.
      # A failing run still saves, because the store only ever holds packages
      # that executed and passed under an unchanged fingerprint.
      - name: Save the recorded test results
        if: success() || failure()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/test-runner/.nupp-test-results
          key: >-
            nupp-test-results-integration-${{ runner.os }}-${{ runner.arch }}-${{
            github.run_id }}-${{ github.run_attempt }}

      # Saved whatever the suite concluded. A failing run still measured every
      # suite that ran, and the next run's shard packing is better for having
      # it than for relearning it from nothing. Keyed by run, like the results:
      # keyed by commit, a second run of one commit could not save, and the
      # next run packed from older timings.
      - name: Save the recorded suite timings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/test-runner/.nupp-test-times.json
          key: >-
            nupp-test-times-${{ runner.os }}-${{ runner.arch }}-${{
            github.run_id }}-${{ github.run_attempt }}

      # The same timings where a reader can download them. The summary prints
      # only the slowest fifteen suites, and a run stopped at its deadline
      # prints none, so this is what says where the rest of the time went.
      - name: Upload the recorded suite timings
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: suite-timings-${{ runner.os }}-${{ runner.arch }}
          path: build/test-runner/.nupp-test-times.json
          if-no-files-found: ignore
          # The file is a dotfile, which upload-artifact otherwise skips.
          include-hidden-files: true

      # Linux has already saved this key from the fast gate, where the same
      # revision built the same compiler; that save warns and keeps the first
      # entry, which is the right outcome. macOS and Windows have their own
      # key and this is the only job that fills it.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  # Byte-identical self-hosting, which is about the compiler's own sources and
  # not about a platform. It was the last step of every matrix entry, where it
  # only ever ran if everything before it was green -- so the one check that
  # says the compiler reproduces itself was the one most often not reached.
  fixpoint:
    name: Self-hosting fixpoint
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.fixpoint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Verify the self-hosting fixpoint
        run: ./bin/nupp fixpoint

  portable-compiler:
    name: LuaJIT browser compiler
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.portable-compiler == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      # A checker or optimizer change anywhere in the compiler can invalidate
      # source shown on the homepage. Compile it under the Worker's default
      # LuaJIT settings here as well as in the browser compiler request corpus.
      - name: Compile every homepage example in LuaJIT mode
        shell: bash
        run: >-
          ./bin/nupp build -O1
          -o build/ci-playground-examples
          editors/playground/src/examples/*.nupp

      - name: Validate the LuaJIT browser compiler bundle
        shell: bash
        run: .github/scripts/test-portable-compiler.sh

  # Documentation generation, its links, and the generated assets a site build
  # produces. This is the whole obligation of a documentation-only change: it
  # provisions no platform matrix, no native toolchain and no GPU adapter.
  docs-site:
    name: Documentation and site
    needs: classify
    if: needs.classify.outputs.docs-site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      - name: Regenerate and verify the documentation
        shell: bash
        run: >-
          .github/scripts/suite-deadline.sh "$(($(date +%s) + NUPP_SUITE_SECONDS))" --
          ./bin/nupp test --fresh --scope=all --group=docs

  # The full LuaJIT browser guest, application packages, browser templates, and
  # generated Pages artifact. Called rather than
  # path-filtered: the sixty-line list of paths that used to bring it into a
  # pull request was maintained by hand, and a new source file reaching the
  # playground was simply not on it.
  browser-wasm:
    name: Browser and Wasm
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.browser-wasm == 'true'
    uses: ./.github/workflows/wasm-playground.yml

  gpu-conformance:
    name: GPU conformance / CI Lavapipe Vulkan
    needs: classify
    if: needs.classify.outputs.gpu-linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the software Vulkan adapter
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -type f | head -n 1)
          test -n "$icd"
          printf 'NUPP_GPU_ICD=%s\n' "$icd" >> "$GITHUB_ENV"

      # The bench's CPU twins are compiled by the AOT code generator, which is
      # LLVM linked into nupp.
      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the compiler
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./scripts/toolchain --all

      # Built here rather than by the script, so the conformance step times
      # dispatch and readback rather than a compiler build (#351).
      - name: Bootstrap the compiler
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./bin/nupp build

      - name: Run exact GPU dispatch and readback
        id: gpu_conformance
        run: .github/scripts/test-gpu-conformance.sh

  gpu-conformance-windows:
    name: GPU conformance / Windows DX12
    needs: classify
    if: needs.classify.outputs.gpu-windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The bench's CPU twins are compiled by the AOT code generator, which is
      # LLVM linked into nupp.
      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./scripts/toolchain --all

      # Built here rather than by the script, so the conformance step times
      # dispatch and readback rather than a compiler build (#351).
      - name: Bootstrap the compiler
        shell: bash
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./bin/nupp build

      # Adapter absence is a failure: Vulkan cannot silently substitute for
      # the retained Windows DX12 contract.
      - name: Run exact DX12 dispatch and readback
        id: gpu_conformance
        shell: bash
        run: .github/scripts/test-gpu-conformance-windows.sh

  # The product has no Rust and no C++ of its own (#8), and this job holds it
  # to that. The tree is refused if a Rust or C++ source, a Cargo manifest or a
  # Rust toolchain file comes back. Then a clean checkout bootstraps the
  # compiler and links a native program with `cargo`, `rustc`, `rustup` and
  # every C++ compiler on PATH replaced by shims that record being run: the
  # compiler's provider and code generator come from the pinned prebuilt release
  # (`scripts/toolchain`, "the prebuilt native provider"), the native program is
  # linked with the prebuilt kit, and a step that reaches Rust or C++ anyway
  # fails here rather than quietly building it (#139, #172).
  prebuilt-native-program:
    name: Native program without Rust or C++
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Refuse Rust and C++ sources
        run: .github/scripts/check-no-rust-or-cpp.sh

      # A version probe compiles nothing, so it is refused without being
      # recorded: `scripts/toolchain` keys a from-source LLVM by the C++
      # compiler's version, and asks for that key to see whether one is built.
      - name: Shadow Rust and C++
        run: |
          set -eu
          shims="$RUNNER_TEMP/no-rust"
          mkdir -p "$shims"
          for tool in cargo rustc rustup c++ g++ clang++; do
            printf '#!/bin/sh\n[ "${1:-}" = --version ] && exit 1\necho "%s $*" >> "%s/ran"\nexit 1\n' "$tool" "$shims" > "$shims/$tool"
            chmod +x "$shims/$tool"
          done
          echo "$shims" >> "$GITHUB_PATH"

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp --version

      - name: Link and run a native program
        run: |
          set -eu
          program="$RUNNER_TEMP/program"
          mkdir -p "$program"
          cat > "$program/prog.nupp" <<'NUPP'
          cdef function puts(borrows s: cstring): int32

          local function main(): int32
              puts("hello from native Nupp")
              return 0
          end
          NUPP
          (cd "$program" && "$GITHUB_WORKSPACE/bin/nupp" aot --emit executable --output prog prog.nupp)
          output=$("$program/prog")
          echo "$output"
          [ "$output" = "hello from native Nupp" ]

      - name: Require that Rust and C++ never ran
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/no-rust/ran" ]; then
            echo "Rust or C++ ran:" >&2
            cat "$RUNNER_TEMP/no-rust/ran" >&2
            exit 1
          fi

  # The full build's own memory, held to a budget on every platform (#257). A
  # cold build of the test runner checks and generates every module in the
  # repository and stamps the native provider; it used to peak at 4-6 GB
  # because every module's checked tree stayed alive until the build ended.
  # Built Cargo-free from the pinned prebuilt provider, so it runs while the
  # Rust-building jobs above are off.
  build-memory:
    name: Full build memory / ${{ matrix.name }}
    needs: classify
    if: needs.classify.outputs.fixpoint == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64, os: ubuntu-24.04}
          - {name: macOS arm64, os: macos-15}
          - {name: Windows x64, os: windows-2022}
    defaults:
      run:
        shell: bash
    env:
      NUPP_CARGO: /nonexistent
      NUPP_RUSTC: /nonexistent
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The toolchain key is shared, and a job that provisions the pinned LLVM
      # can be the one that saves it. With LLVM the host links it in, a build
      # about 450 MB larger than the one the budget holds (#303).
      - name: Drop any LLVM tree the cache carried
        run: rm -rf .nupp-cache/toolchain/llvm

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp --version

      - name: Hold the full build to its memory budget
        run: ./scripts/build-memory-budget

  # The same build where the pinned LLVM is in place, as it is in every checkout
  # that provisions it and in every job that uses pinned-llvm: the test runner's
  # host then links LLVM in and is about 140 MB, and nothing else held that
  # build to a budget (#303, #310). Stamping that host used to read it whole
  # and copy it, which put 170-830 MB on the peak depending on the platform,
  # so it has budgets of its own that a return of anything like that fails.
  build-memory-llvm:
    name: Full build memory with LLVM / ${{ matrix.name }}
    needs: classify
    if: needs.classify.outputs.fixpoint == 'true'
    runs-on: ${{ matrix.os }}
    # LLVM comes from the cache or a stored artifact, and is built only when an
    # eviction emptied both.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Set from three runs each: Linux 718-725 MB, macOS 699-735, Windows
          # 795-817 (#310).
          - {name: Linux x64, os: ubuntu-24.04, budget: 850}
          - {name: macOS arm64, os: macos-15, budget: 850}
          - {name: Windows x64, os: windows-2022, budget: 950}
    defaults:
      run:
        shell: bash
    env:
      NUPP_CARGO: /nonexistent
      NUPP_RUSTC: /nonexistent
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch or build the pinned LLVM
        uses: ./.github/actions/pinned-llvm

      - name: Provision the pinned toolchain
        env:
          NUPP_REQUIRE_CODEGEN: '1'
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp --version

      - name: Hold the LLVM-linked full build to its memory budget
        run: ./scripts/build-memory-budget --llvm ${{ matrix.budget }}

  # The one status a ruleset should require. Its meaning does not change when
  # the jobs above are reorganized, renamed, or split, and it cannot pass by a
  # job being skipped: a job the classifier selected and that did not succeed
  # fails this, and so does a classification that failed to happen at all.
  required-ci:
    name: required-ci
    if: always()
    needs:
      - classify
      - fast-checks
      - bootstrap
      - integration
      - fixpoint
      - portable-compiler
      - browser-wasm
      - docs-site
      - gpu-conformance
      - gpu-conformance-windows
      - prebuilt-native-program
      - build-memory
      - build-memory-llvm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's queue delay and its per-job durations are only on the API, and
    # a workflow cannot read its own run without being told it may.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Require every selected job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/require-selected-jobs.py

      # One row per required run, so queue delay, execution time and the failed
      # step are answerable from retained data rather than from whichever run
      # somebody happens to still have open.
      - name: Record the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/record-required-run.sh

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-record
          if-no-files-found: warn
          retention-days: 90
