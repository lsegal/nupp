name: Compiler matrix

on:
  # Every branch, and the trunk above all.
  #
  # This was briefly `branches-ignore: main`, which was right only while a
  # ruleset stood in front of the trunk: a check run belongs to a commit rather
  # than to a branch, so the branch run was the one the trunk push presented,
  # and running the same matrix again over the same commit object bought
  # nothing. There is no ruleset now. Nothing else asks a question about a
  # commit pushed straight to `main`, so if this does not, nothing does.
  #
  # Worktree branches are here too, so a task can find out before it lands
  # rather than after.
  push:
    branches:
      - "**"
    # A pre-release tag (`v0.0.15-vm.1`) names a commit its branch push already
    # tested; running the matrix again over the same commit buys nothing.
    tags:
      - "*"
      - "!v*-*"
  # Retained for a contribution from a fork, where no push to this repository
  # happens and this is the only event there is. A pull request from a branch of
  # this repository would be tested twice, which is a case this repository's
  # workflow does not produce.
  pull_request:
  workflow_dispatch:
  # The affected-surface classifier is deliberately conservative, but it is a
  # judgement all the same. Run the whole matrix nightly whatever changed, so a
  # gap in the classification is found by this backstop rather than by a user.
  # A failure here is a bug and blocks the next release; it is not a warning.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  # The browser guest it calls fetches the pinned LLVM artifact.
  actions: read

# Grouped per ref, so a newer push to the same ref cancels the older run.
#
# This was briefly grouped per commit, to keep a result against every commit in
# the trunk's history rather than only against the tip. It cost more than it
# bought: a per-commit group is a group of one, so nothing ever supersedes
# anything, and the macOS leg takes an hour and a half against commits that land
# every few minutes. The queue grows without bound, and the answer a run finally
# gives is about a commit twenty commits behind the tip -- which leaves the tip,
# the one commit anybody is going to act on, the last thing to be tested.
#
# What is given up is the ability to say "this commit was green and the next one
# was red" directly. A cancelled run means a later run covers both commits, so a
# failure there is bisected rather than read off. That is the cheaper half of the
# trade, because the trunk is fixed forward: what matters is that the tip is
# tested promptly, and under the per-commit shape it never was.
#
# A worktree branch loses nothing by this. The old shape kept its run alive on
# the grounds that it is the only thing standing between that commit and the
# trunk, but a second push to the same branch has already replaced the commit
# that run was answering about; the branch's tip is the only answer its task
# wants, and that is the run that survives.
#
# The event name is in the key so a push cannot cancel the nightly backstop
# declared above: a scheduled run's `github.ref` is `refs/heads/main` too.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything a run can decide before it provisions anything. This is the job
  # that must stay cheap: the platform matrices wait on it, so a minute here is
  # a minute added to every path through the graph.
  classify:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs-site: ${{ steps.classify.outputs.docs-site }}
      fast-checks: ${{ steps.classify.outputs.fast-checks }}
      portable-compiler: ${{ steps.classify.outputs.portable-compiler }}
      browser-wasm: ${{ steps.classify.outputs.browser-wasm }}
      fixpoint: ${{ steps.classify.outputs.fixpoint }}
      selection: ${{ steps.classify.outputs.selection }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the provisioned toolchain
        uses: actions/cache/restore@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # The classifier is plain Lua so that the suite can assert on it. This is
      # the only thing this job provisions, and on a cache hit it is a second.
      - name: Provide a Lua interpreter
        run: echo "$(./scripts/toolchain luajit)/bin" >> "$GITHUB_PATH"

      - name: Name the changed paths
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          usable() {
            [ -n "$1" ] \
              && [ "$1" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          # A branch is compared against the trunk it will become, never against
          # its own previous tip.
          #
          # `before` is the tempting answer and it is wrong. What this run
          # authorises is pushing `HEAD_SHA` to `main`, so the question is what
          # this commit changes about the trunk -- not what its last commit
          # changed about the one before it. Narrowing against `before` opens a
          # real hole: a commit that fails the GPU job, then a commit touching
          # only documentation, and the second run skips GPU, goes green, and
          # carries the first one's failure onto the trunk. Comparing against the
          # merge base costs the same and cannot do that.
          #
          # It is also the honest answer for the case that happens most here: a
          # task worktree pushed once when its work is done, whose `before` is
          # all zeros because the branch is new.
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            # The trunk has no merge base to compare against but its own
            # history, so the previous tip is the answer here, and it is the
            # right one: what is new on `main` is what arrived since `main` was
            # last at that commit.
            base=$PUSH_BEFORE
          elif [ "$EVENT" = push ]; then
            git fetch --no-tags --depth=200 origin main 2>/dev/null || true
            base=$(git merge-base FETCH_HEAD "$HEAD_SHA" 2>/dev/null || true)
            # A branch with no common history with `main` -- or a fetch that did
            # not reach far enough back -- has no merge base, and `before` is
            # then better than nothing.
            if ! usable "$base"; then
              base=$PUSH_BEFORE
            fi
          fi

          # A tag, a schedule and a manual dispatch have no diff to narrow, and
          # neither does a branch whose merge base could not be found. An empty
          # list means "everything", which the classifier decides rather than
          # this shell.
          if usable "$base"; then
            git diff --name-only "$base" "$HEAD_SHA" > changed-paths.txt
          else
            : > changed-paths.txt
          fi
          echo "--- changed paths ---"
          cat changed-paths.txt

      - name: Classify the affected surfaces
        id: classify
        run: luajit .github/scripts/classify-changes.lua < changed-paths.txt

      # The classifier and the workflow have to agree about which jobs exist.
      # They are two files, so the only thing that keeps them agreeing is this
      # check, which runs before anything expensive is provisioned.
      - name: Validate selected-job aggregation
        run: python3 .github/scripts/test-required-ci.py

      - name: Validate the workflow against the classifier
        run: luajit .github/scripts/validate-ci-coverage.lua

      # Only on a cold cache, where this job has just built LuaJIT from source
      # and every job behind it is about to do the same. `fast-checks` saves the
      # same key, so whichever arrives second warns and keeps the first entry.
      - name: Save the provisioned toolchain
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}

  # Formatting, the checker, and every suite a Nupp worker can share a process
  # with. Run these before the platform jobs so failures appear before platform
  # provisioning.
  fast-checks:
    name: Fast checks
    needs: classify
    if: needs.classify.outputs.fast-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the content-validated compiler cache
        uses: actions/cache/restore@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}
          restore-keys: |
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      # The pre-push hook asks the same question of the files a push changes.
      # Ask it of the whole tree here, because a rewrite landed by a `--no-verify`
      # push is otherwise found by whichever unrelated change comes next.
      - name: Check the formatting
        run: |
          ./bin/nupp fmt --write
          if ! git diff --quiet; then
            echo "nupp fmt --write rewrote committed source:"
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - name: Check the compiler
        run: ./bin/nupp check

      - name: Run the shared-process suites
        run: ./bin/nupp test --fresh --scope=all --lane=shared

      # Saved explicitly rather than through the action's post step, so a run
      # that fails a suite still keeps the compiler build the next run would
      # otherwise redo. The entries validate their own content, so a stale one
      # is a miss and cannot change an answer.
      - name: Save the content-validated compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/cache
          key: >-
            nupp-buildcache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('src/**', 'nupp.lua', 'scripts/toolchain.pins') }}

  # Byte-identical self-hosting, which is about the compiler's own sources and
  # not about a platform. It was the last step of every matrix entry, where it
  # only ever ran if everything before it was green -- so the one check that
  # says the compiler reproduces itself was the one most often not reached.
  fixpoint:
    name: Self-hosting fixpoint
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.fixpoint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Verify the self-hosting fixpoint
        run: ./bin/nupp fixpoint

  portable-compiler:
    name: LuaJIT browser compiler
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.portable-compiler == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        shell: bash
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        shell: bash
        run: ./bin/nupp build

      # A checker or optimizer change anywhere in the compiler can invalidate
      # source shown on the homepage. Compile it under the Worker's default
      # LuaJIT settings here as well as in the browser compiler request corpus.
      - name: Compile every homepage example in LuaJIT mode
        shell: bash
        run: >-
          ./bin/nupp build -O1
          -o build/ci-playground-examples
          editors/playground/src/examples/*.nupp

      - name: Validate the LuaJIT browser compiler bundle
        shell: bash
        run: .github/scripts/test-portable-compiler.sh

  # Documentation generation, its links, and the generated assets a site build
  # produces. This is the whole obligation of a documentation-only change: it
  # provisions no platform matrix, no native toolchain and no GPU adapter.
  docs-site:
    name: Documentation and site
    needs: classify
    if: needs.classify.outputs.docs-site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Restore the pinned build tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/nupp-ci-tools
            .rocks
          key: >-
            nupp-tools-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'rocks/**') }}

      - name: Restore the provisioned toolchain
        uses: actions/cache@v4
        with:
          path: .nupp-cache/toolchain
          key: >-
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('scripts/toolchain.pins', 'scripts/toolchain') }}
          restore-keys: |
            nupp-toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Provision the pinned toolchain
        run: ./scripts/toolchain --all

      - name: Bootstrap the compiler
        run: ./bin/nupp build

      - name: Install the development rocks
        run: |
          ./bin/nupp build --target bootstrapCompiler
          ./bin/nupp build --target docs

      - name: Regenerate and verify the documentation
        run: ./bin/nupp test --fresh --scope=all --group=docs

  # The full LuaJIT browser guest, application packages, browser templates, and
  # generated Pages artifact. Called rather than
  # path-filtered: the sixty-line list of paths that used to bring it into a
  # pull request was maintained by hand, and a new source file reaching the
  # playground was simply not on it.
  browser-wasm:
    name: Browser and Wasm
    needs: [classify, fast-checks]
    if: >-
      !cancelled() && needs.classify.result == 'success'
      && needs.fast-checks.result == 'success'
      && needs.classify.outputs.browser-wasm == 'true'
    uses: ./.github/workflows/wasm-playground.yml

  # The one status a ruleset should require. Its meaning does not change when
  # the jobs above are reorganized, renamed, or split, and it cannot pass by a
  # job being skipped: a job the classifier selected and that did not succeed
  # fails this, and so does a classification that failed to happen at all.
  required-ci:
    name: required-ci
    if: always()
    needs:
      - classify
      - fast-checks
      - fixpoint
      - portable-compiler
      - browser-wasm
      - docs-site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's queue delay and its per-job durations are only on the API, and
    # a workflow cannot read its own run without being told it may.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Require every selected job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/require-selected-jobs.py

      # One row per required run, so queue delay, execution time and the failed
      # step are answerable from retained data rather than from whichever run
      # somebody happens to still have open.
      - name: Record the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.classify.outputs.selection }}
        run: .github/scripts/record-required-run.sh

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-record
          if-no-files-found: warn
          retention-days: 90
